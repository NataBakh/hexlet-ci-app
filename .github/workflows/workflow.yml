name: workflow for CI Hexlet course

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'      
      - run: make install
      - run: make test
      - run: make lint
      - uses: hexlet-components/hello-from-hexlet-action@release